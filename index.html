function speak(text) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'en-US';
  utter.rate = AUDIO_SETTINGS.rate;
  window.speechSynthesis.speak(utter);
  return utter;
}
function charIndexToWordIndex(text, charIndex) {
  const words = text.split(' ');
  let pos = 0;
  for (let i = 0; i < words.length; i++) {
    const end = pos + words[i].length;
    if (charIndex >= pos && charIndex <= end) return i;
    pos = end + 1;
  }
  return words.length - 1;
}
function speakKaraoke(text, onWord, onDone) {
  if (!('speechSynthesis' in window)) {
    if (onDone) onDone();
    return;
  }
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'en-US';
  utter.rate = AUDIO_SETTINGS.rate;
  utter.onboundary = e => {
    if (typeof e.charIndex === 'number') onWord(charIndexToWordIndex(text, e.charIndex));
  };
  utter.onend = () => {
    onWord(-1);
    if (onDone) onDone();
  };
  utter.onerror = () => {
    onWord(-1);
    if (onDone) onDone();
  };
  window.speechSynthesis.speak(utter);
}
function normalizeText(s) {
  return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^\w\s]/g, '').trim().replace(/\s+/g, ' ');
}
function shuffleArr(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = a[i];
    a[i] = a[j];
    a[j] = tmp;
  }
  return a;
}
function scrambleWord(word) {
  if (word.length <= 1) return word;
  let s = word;
  let attempts = 0;
  while (s === word && attempts < 10) {
    s = shuffleArr(word.split('')).join('');
    attempts++;
  }
  return s;
}
function todayKey() {
  return new Date().toISOString().slice(0, 10);
}
function computeStreak(visitDates) {
  const set = new Set(visitDates);
  let streak = 0;
  const d = new Date();
  while (true) {
    const key = d.toISOString().slice(0, 10);
    if (set.has(key)) {
      streak++;
      d.setDate(d.getDate() - 1);
    } else break;
  }
  return streak;
}

/* --- Repetición espaciada (sistema de cajas tipo Leitner) --- */
const BOX_INTERVALS = [1, 2, 4, 8, 16, 30];
function scheduleNext(currentBox, correct) {
  const box = typeof currentBox === 'number' ? currentBox : -1;
  const newBox = correct ? Math.min(box + 1, BOX_INTERVALS.length - 1) : 0;
  const due = new Date();
  due.setDate(due.getDate() + BOX_INTERVALS[newBox]);
  return {
    box: newBox,
    due: due.toISOString().slice(0, 10)
  };
}
function parseWordId(wordId) {
  const parts = wordId.split('-');
  const idx = parseInt(parts[parts.length - 1], 10);
  const catId = parts.slice(0, -1).join('-');
  return {
    catId,
    idx
  };
}
function getDueWords(progress) {
  const today = todayKey();
  const list = [];
  progress.knownWords.forEach(wordId => {
    const {
      catId,
      idx
    } = parseWordId(wordId);
    const cat = VOCAB_CATEGORIES.find(c => c.id === catId);
    if (!cat || !cat.words[idx]) return;
    const entry = progress.srs[wordId];
    if (!entry || entry.due <= today) list.push({
      wordId,
      word: cat.words[idx]
    });
  });
  return list;
}

function computeXP(p) {
  let xp = 0;
  xp += p.knownWords.length * 10;
  xp += Object.values(p.grammarScores).reduce((s, sc) => s + sc * 5, 0);
  xp += Object.values(p.readingScores).reduce((s, sc) => s + sc * 5, 0);
  xp += p.practicedPhrases.length * 8;
  xp += p.sentencesCompleted.length * 12;
  xp += p.dictationDone.length * 8;
  xp += p.translationDone.length * 10;
  xp += p.clozeDone.length * 10;
  xp += (p.irregularVerbsDone || []).length * 8;
  xp += (p.idiomsLearned || []).length * 8;
  xp += (p.emojiCorrectCount || 0) * 3;
  xp += (p.anagramsDone || []).length * 8;
  xp += (p.achievementsUnlocked || []).length * 25;
  return xp;
}

function computeLevel(xp) {
  let current = LEVELS[0];
  let next = LEVELS[1] || null;
  for (let i = 0; i < LEVELS.length; i++) {
    if (xp >= LEVELS[i].min) {
      current = LEVELS[i];
      next = LEVELS[i + 1] || null;
    }
  }
  const span = next ? next.min - current.min : 1;
  const into = next ? xp - current.min : span;
  const pct = next ? Math.min(100, Math.round(into / span * 100)) : 100;
  return {
    current,
    next,
    xp,
    pct
  };
}

function hasCloudStorage() {
  return typeof window.storage !== 'undefined';

async function storageGet(key) {
  if (hasCloudStorage()) {
    try {
      const res = await window.storage.get(key);
      return res ? res.value : null;
    } catch (e) {
      return null;
    }
  }
  try {
    return window.localStorage.getItem(key);
  } catch (e) {
    return null;
  }
}
async function storageSet(key, value) {
  if (hasCloudStorage()) {
    try {
      await window.storage.set(key, value);
      return;
    } catch (e) {}
  }
  try {
    window.localStorage.setItem(key, value);
  } catch (e) {}
}

const GIST_FILENAME = 'bridge-english-progress.json';
async function gistSync(token, gistId, progress) {

    method: gistId ? 'PATCH' : 'POST',
    headers: {
      Authorization: `Bearer ${token}`,
      Accept: 'application/vnd.github+json',
      'Content-Type': 'application/json'
    },
    body: JSON.stringify(payload)

  const data = await res.json();
  return data.id;
}

  const res = await fetch(`https://api.github.com/gists/${gistId}`, {
    headers: {
      Authorization: `Bearer ${token}`,
      Accept: 'application/vnd.github+json'
    }
  });
  if (!res.ok) throw new Error('No se pudo restaurar (código ' + res.status + ')');
