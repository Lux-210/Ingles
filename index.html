<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: #0D1117; }
  button { font-family: inherit; cursor: pointer; }
  button:disabled { cursor: default; }
  button:active { transform: scale(0.97); }
  button:focus-visible, input:focus-visible { outline: 2px solid #2DD4BF; outline-offset: 2px; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #2A3441; border-radius: 999px; }

  @keyframes shake { 10%,90%{transform:translateX(-1px)} 20%,80%{transform:translateX(2px)} 30%,50%,70%{transform:translateX(-4px)} 40%,60%{transform:translateX(4px)} }
  .shake { animation: shake .4s; }

  @keyframes fadeSlideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .view-enter { animation: fadeSlideIn .4s ease both; }
  .card-enter { animation: fadeSlideIn .45s ease both; }

  @keyframes pop { 0% { transform: scale(.85); opacity: 0; } 60% { transform: scale(1.04); } 100% { transform: scale(1); opacity: 1; } }
  .pop { animation: pop .35s ease both; }

  .flip-card { perspective: 1200px; }
  .flip-inner { position: relative; width: 100%; transition: transform .5s cubic-bezier(.4,.2,.2,1); transform-style: preserve-3d; }
  .flip-inner.is-flipped { transform: rotateY(180deg); }
  .flip-face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .flip-back { transform: rotateY(180deg); }

  .progress-fill { transition: width .6s cubic-bezier(.4,.2,.2,1); }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
:focus-visible{outline:2px solid #2DD4BF;outline-offset:2px;border-radius:6px}
</style>

is"],answer:1},{text:"He ___ already eaten lunch.",options:["have","has","is"],answer:1}]},{id:"condicionales",title:"Primer condicional",explanation:"Habla de situaciones posibles en el futuro. Se forma con 'if' + presente simple, + 'will' + verbo.",conjugation:["If + presente simple, will + verbo"],examples:["If it rains, I will stay home.","If you study, you will pass the exam.","If she calls, I will answer.","We will go out if the weather is nice."],questions:[{text:"If it ___ rain, we will stay home.",options:["will","does","is"],answer:1},{text:"If you study, you ___ pass.",options:["will","do","are"],answer:0},{text:"She will call if she ___ time.",options:["will have","has","had"],answer:1},{text:"If he ___ hungry, he will eat.",options:["is","will be","was"],answer:0}]},{id:"prep-lugar",title:"Preposiciones de lugar: in / on / at",explanation:"Usa 'in' para espacios cerrados o grandes áreas, 'on' para superficies, y 'at' para puntos específicos.",conjugation:["in the room","on the table","at the door"],examples:["The keys are in the box.","The book is on the table.","She is waiting at the bus stop.","They live in New York."],questions:[{text:"The cat is ___ the box.",options:["in","on","at"],answer:0},{text:"There is a picture ___ the wall.",options:["in","on","at"],answer:1},{text:"I will meet you ___ the corner.",options:["in","on","at"],answer:2},{text:"We live ___ Chile.",options:["in","on","at"],answer:0}]},{id:"there-is-are",title:"There is / There are",explanation:"'There is' se usa con sustantivos singulares o incontables, y 'there are' con plurales, para decir que algo existe.",conjugation:["There is + singular","There are + plural"],examples:["There is a book on the table.","There are three chairs in the room.","Is there any coffee?","There aren't any eggs."],questions:[{text:"___ a cat in the garden.",options:["There is","There are","Is there"],answer:0},{text:"___ many students in the class.",options:["There is","There are","There am"],answer:1},{text:"___ any milk in the fridge?",options:["There is","Is there","There are"],answer:1},{text:"There ___ two windows in this room.",options:["is","are","am"],answer:1}]},{id:"some-any",title:"Some / Any",explanation:"'Some' se usa en oraciones afirmativas, y 'any' en negativas y preguntas.",conjugation:["some (afirmativo)","any (negativo / pregunta)"],examples:["I have some money.","I don't have any money.","Do you have any questions?","She bought some apples."],questions:[{text:"I need ___ help with this.",options:["some","any","a"],answer:0},{text:"We don't have ___ time left.",options:["some","any","much"],answer:1},{text:"Do you have ___ brothers?",options:["some","any","the"],answer:1},{text:"She has ___ interesting ideas.",options:["some","any","no"],answer:0}]},{id:"much-many",title:"Much / Many / A little / A few",explanation:"'Much' y 'a little' van con sustantivos incontables; 'many' y 'a few' van con sustantivos contables.",conjugation:["much water","many books","a little sugar","a few friends"],examples:["I don't have much time.","She has many friends.","Add a little salt.","I have a few questions."],questions:[{text:"How ___ money do you have?",options:["much","many","few"],answer:0},{text:"There are ___ people in the park.",options:["much","many","little"],answer:1},{text:"I have ___ patience left.",options:["many","few","little"],answer:2},{text:"He has ___ good friends.",options:["much","a few","little"],answer:1}]},{id:"pronombres-objeto",title:"Pronombres objeto",explanation:"Reciben la acción del verbo: me (a mí), him (a él), her (a ella), us (a nosotros), them (a ellos).",conjugation:["me","you","him / her / it","us","them"],examples:["She called me yesterday.","I saw him at the store.","Can you help us?","I gave them the tickets."],questions:[{text:"Please, call ___ later.",options:["I","me","my"],answer:1},{text:"I saw ___ at the park.",options:["she","her","hers"],answer:1},{text:"Can you help ___?",options:["we","us","our"],answer:1},{text:"I gave ___ the keys.",options:["they","them","their"],answer:1}]},{id:"adjetivos-adverbios",title:"Adjetivos y adverbios (-ly)",explanation:"Los adjetivos describen sustantivos; los adverbios describen verbos y muchas veces se forman agregando '-ly'.",conjugation:["quick → quickly","slow → slowly","careful → carefully"],examples:["She is a quick runner.","She runs quickly.","He is a careful driver.","He drives carefully."],questions:[{text:"He speaks English very ___.",options:["good","well","goodly"],answer:1},{text:"She is a ___ singer.",options:["beautiful","beautifully"],answer:0},{text:"They walked ___ through the forest.",options:["quiet","quietly"],answer:1},{text:"This is a ___ question.",options:["difficult","difficultly"],answer:0}]},{id:"segundo-condicional",title:"Segundo condicional",explanation:"Habla de situaciones hipotéticas o imaginarias. Se forma con 'if' + pasado simple, + 'would' + verbo.",conjugation:["If + pasado simple, would + verbo"],examples:["If I had more money, I would travel.","If she studied more, she would pass.","What would you do if you won the lottery?","If it rained, I would stay home."],questions:[{text:"If I ___ a bird, I would fly.",options:["am","was","were"],answer:2},{text:"If she had time, she ___ visit us.",options:["will","would","did"],answer:1},{text:"What would you do if you ___ rich?",options:["are","were","will be"],answer:1},{text:"If I ___ him, I would apologize.",options:["was","were","am"],answer:1}]},{id:"voz-pasiva",title:"Voz pasiva (presente simple)",explanation:"El sujeto recibe la acción. Se forma con 'to be' + participio pasado.",conjugation:["is/are + participio"],examples:["The letter is written by Ana.","The car is washed every week.","English is spoken here.","The bread is made every morning."],questions:[{text:"The house ___ cleaned every day.",options:["is","are","was"],answer:0},{text:"These cookies ___ made by my mom.",options:["is","are","be"],answer:1},{text:"The windows ___ closed at night.",options:["is","are","am"],answer:1},{text:"This song ___ sung all over the world.",options:["is","are","be"],answer:0}]},{id:"prep-movimiento",title:"Preposiciones de movimiento",explanation:"'To' indica dirección hacia un lugar, 'into' indica entrar en un espacio, y 'from' indica origen.",conjugation:["to the store","into the room","from home"],examples:["She walked to the store.","He went into the kitchen.","I came from home.","They traveled from Chile to Peru."],questions:[{text:"She walked ___ the park.",options:["to","into","from"],answer:0},{text:"He jumped ___ the pool.",options:["to","into","from"],answer:1},{text:"We flew ___ Santiago ___ Lima.",options:["from / to","to / from","into / to"],answer:0},{text:"The cat ran ___ the house.",options:["into","from","at"],answer:0}]},{id:"gerundio-infinitivo",title:"Gerundio vs. infinitivo",explanation:"Algunos verbos van seguidos de '-ing' (like, enjoy, hate) y otros de 'to + verbo' (want, need, decide).",conjugation:["like + -ing","want + to"],examples:["I enjoy reading books.","She wants to travel.","They hate waiting.","We decided to leave early."],questions:[{text:"I enjoy ___ music.",options:["listen","listening","to listen"],answer:1},{text:"She wants ___ a doctor.",options:["become","becoming","to become"],answer:2},{text:"He hates ___ up early.",options:["wake","waking","to wake"],answer:1},{text:"We decided ___ home.",options:["stay","staying","to stay"],answer:2}]},{id:"oraciones-relativas",title:"Oraciones relativas (who / which / that)",explanation:"'Who' se usa para personas, 'which' para cosas, y 'that' puede usarse para ambos en oraciones informales.",conjugation:["who (personas)","which (cosas)","that (ambos)"],examples:["The man who called is my uncle.","The book which I read was great.","This is the car that I bought.","She is the teacher who helped me."],questions:[{text:"The woman ___ lives next door is a doctor.",options:["who","which","what"],answer:0},{text:"The movie ___ we watched was funny.",options:["who","which","whom"],answer:1},{text:"This is the house ___ I grew up in.",options:["who","that","whose"],answer:1},{text:"The students ___ studied hard passed the exam.",options:["which","who","whom"],answer:1}]},{id:"phrasal-verbs",title:"Phrasal verbs comunes",explanation:"Verbos combinados con una preposición que cambian de significado: get up (levantarse), turn off (apagar), look for (buscar).",conjugation:["get up","turn off","look for","give up"],examples:["I get up at seven.","Please turn off the lights.","She is looking for her keys.","Never give up on your dreams."],questions:[{text:"Can you ___ the TV? It's too loud.",options:["turn off","get up","look for"],answer:0},{text:"I ___ my phone everywhere.",options:["give up","looked for","turn off"],answer:1},{text:"He never ___, even when it's hard.",options:["gives up","turns off","gets up"],answer:0},{text:"What time do you usually ___?",options:["turn off","get up","look for"],answer:1}]},{id:"estilo-indirecto",title:"Estilo indirecto (reported speech)",explanation:"Cuando repetimos lo que alguien dijo, el tiempo verbal generalmente retrocede un paso: presente → pasado, presente perfecto → pasado perfecto, will → would. También cambian los pronombres.",conjugation:['"I am tired" → He said he was tired','"I have finished" → She said she had finished','"I will call" → He said he would call'],examples:['She said, "I am happy." → She said she was happy.','He said, "I will help you." → He said he would help me.','"I have seen that movie," she said. → She said she had seen that movie.','"I work here," he said. → He said he worked there.'],questions:[{text:'He said, "I am busy." → He said he ___ busy.',options:["is","was","were"],answer:1},{text:'"I will call you," she said. → She said she ___ call me.',options:["will","would","was"],answer:1},{text:'"I have finished," he said. → He said he ___ finished.',options:["has","have","had"],answer:2},{text:'"I can swim," she said. → She said she ___ swim.',options:["can","could","will"],answer:1}]},{id:"tercer-condicional",title:"Tercer condicional",explanation:"Habla de situaciones hipotéticas en el pasado que no ocurrieron. Se forma con 'if' + pasado perfecto (had + participio), + 'would have' + participio.",conjugation:["If + pasado perfecto, would have + participio"],examples:["If I had studied, I would have passed.","If she had known, she would have called.","If we had left earlier, we would have arrived on time.","If it had rained, we would have stayed home."],questions:[{text:"If I ___ known, I would have told you.",options:["had","have","has"],answer:0},{text:"If she had studied, she ___ passed.",options:["would","would have","will"],answer:1},{text:"If we had left earlier, we ___ missed the bus.",options:["wouldn't have","wouldn't","won't"],answer:0},{text:"If it had rained, the match ___ cancelled.",options:["would be","would have been","was"],answer:1}]},{id:"voz-pasiva-pasado",title:"Voz pasiva (pasado simple)",explanation:"El sujeto recibe la acción, igual que en presente, pero con 'was/were' + participio pasado en vez de 'is/are'.",conjugation:["was/were + participio"],examples:["The letter was written yesterday.","The windows were cleaned last week.","The cake was made by my mother.","The house was built in 1990."],questions:[{text:"The book ___ written in 1950.",options:["was","were","is"],answer:0},{text:"The cookies ___ made by my grandmother.",options:["was","were","is"],answer:1},{text:"This song ___ recorded last year.",options:["was","were","is"],answer:0},{text:"The windows ___ broken during the storm.",options:["was","were","are"],answer:1}]},{id:"relativas-explicativas",title:"Oraciones relativas explicativas",explanation:"A diferencia de las oraciones relativas normales, estas dan información extra (no esencial) y van entre comas. No se puede usar 'that' aquí, solo 'who' o 'which'.",conjugation:["..., who ..., ","..., which ..., "],examples:["My brother, who lives in Chile, is a doctor.","This book, which I bought last week, is excellent.","Ana, who is my best friend, called me yesterday.","The hotel, which was very expensive, had a beautiful view."],questions:[{text:"My sister, ___ lives in Spain, is visiting us.",options:["who","that","which"],answer:0},{text:"This movie, ___ won several awards, is very long.",options:["who","which","that"],answer:1},{text:"Mr. Lopez, ___ teaches math, is retiring this year.",options:["which","who","that"],answer:1},{text:"The museum, ___ opened in 1990, is closed on Mondays.",options:["who","that","which"],answer:2}]},{id:"wish",title:"Wish (deseos y arrepentimiento)",explanation:"'Wish' + pasado simple expresa un deseo sobre el presente (algo que no es real ahora). 'Wish' + pasado perfecto expresa arrepentimiento sobre algo del pasado.",conjugation:["wish + pasado simple (presente)","wish + pasado perfecto (pasado)"],examples:["I wish I had more time.","She wishes she lived closer.","I wish I had studied more.","He wishes he had called her."],questions:[{text:"I wish I ___ more free time. (ahora)",options:["have","had","will have"],answer:1},{text:"She wishes she ___ taller. (ahora)",options:["is","was","were"],answer:2},{text:"I wish I ___ that. (arrepentimiento del pasado)",options:["didn't say","hadn't said","don't say"],answer:1},{text:"He wishes he ___ harder for the exam. (pasado)",options:["studied","had studied","studies"],answer:1}]}],P=[{id:"my-family",title:"My Family",level:"Principiante",text:"Hi! My name is Ana. I have a small family. My father's name is Carlos, and he is an engineer. My mother's name is Laura, and she is a teacher. I have one brother. His name is Diego. We live in a nice house in the city. Every Sunday, we eat lunch together and talk about our week.",questions:[{text:"What is Ana's father's job?",options:["Teacher","Engineer","Doctor"],answer:1},{text:"How many brothers does Ana have?",options:["One","Two","Three"],answer:0},{text:"When do they eat lunch together?",options:["Monday","Saturday","Sunday"],answer:2}]},{id:"daily-routine",title:"My Daily Routine",level:"Principiante",text:"Every day, I wake up at seven o'clock. First, I take a shower and get dressed. Then, I eat breakfast with my family. I usually have coffee and toast. After breakfast, I go to work by bus. I work from nine to five. In the evening, I cook dinner and watch television. I go to bed at eleven o'clock.",questions:[{text:"What time does the writer wake up?",options:["Six","Seven","Eight"],answer:1},{text:"How does the writer go to work?",options:["By car","By bus","By train"],answer:1},{text:"What does the writer do in the evening?",options:["Study","Cook and watch TV","Exercise"],answer:1}]},{id:"restaurant",title:"At the Restaurant",level:"Intermedio",text:"Good evening! Table for two? asked the waiter. Yes, please, said Maria. They sat down, and the waiter gave them the menu. I would like the chicken with rice, said Maria. And I will have the fish, said her friend Pedro. Would you like something to drink? the waiter asked. Two glasses of water, please, said Maria. The food was delicious, and they had a great evening.",questions:[{text:"How many people are at the table?",options:["One","Two","Three"],answer:1},{text:"What did Maria order?",options:["Fish","Chicken with rice","Salad"],answer:1},{text:"What did they drink?",options:["Coffee","Juice","Water"],answer:2}]},{id:"trip-nyc",title:"A Trip to New York",level:"Intermedio",text:"Last summer, my friend and I traveled to New York City. We stayed in a small hotel near Central Park. Every morning, we walked around the park and drank coffee. In the afternoons, we visited museums and famous places like Times Square. The food was amazing, and the people were very friendly. It was one of the best trips of my life.",questions:[{text:"Where did they stay?",options:["A big house","A small hotel","An apartment"],answer:1},{text:"What did they do every morning?",options:["Visit museums","Walk in the park","Go shopping"],answer:1},{text:"How did the writer describe the trip?",options:["Boring","One of the best","Too short"],answer:1}]},{id:"favorite-season",title:"My Favorite Season",level:"Intermedio",text:"My favorite season is summer. The weather is warm and sunny, and the days are long. I love going to the beach with my friends. We swim in the ocean and play volleyball. In the evening, we eat ice cream and watch the sunset. Summer makes me feel happy and relaxed. I wait for it all year.",questions:[{text:"What is the writer's favorite season?",options:["Winter","Summer","Spring"],answer:1},{text:"What does the writer do at the beach?",options:["Read books","Swim and play volleyball","Sleep"],answer:1},{text:"How does summer make the writer feel?",options:["Tired","Sad","Happy and relaxed"],answer:2}]},{id:"job-interview",title:"A Job Interview",level:"Avanzado",text:"Good morning. Please, sit down, said the interviewer. Thank you for having me, replied Sofia. Can you tell me about your experience? the interviewer asked. I have worked as a graphic designer for five years, said Sofia. I have also managed small teams. That is impressive. Why do you want to work here? I admire your company’s projects, and I believe I can contribute new ideas. The interviewer smiled and said, We will contact you next week with our decision.",questions:[{text:"What is Sofia's profession?",options:["Teacher","Graphic designer","Doctor"],answer:1},{text:"How many years of experience does she have?",options:["Three","Five","Ten"],answer:1},{text:"When will the interviewer contact her?",options:["Tomorrow","Next week","Next month"],answer:1}]},{id:"climate-news",title:"Climate News",level:"Avanzado",text:"Scientists announced today that global temperatures have risen significantly over the past decade. According to a new report, many cities are experiencing hotter summers and less rainfall. Experts recommend that governments invest in renewable energy and protect natural forests. Local communities are also starting projects to plant more trees and reduce waste. Although the situation is serious, many people believe that small changes can make a big difference.",questions:[{text:"What has risen over the past decade?",options:["Rainfall","Global temperatures","Forest size"],answer:1},{text:"What do experts recommend?",options:["More renewable energy","More cities","Less rain"],answer:0},{text:"What are local communities doing?",options:["Nothing","Planting trees and reducing waste","Moving away"],answer:1}]},{id:"lost-wallet",title:"The Lost Wallet",level:"Intermedio",text:"Last week, Tom found a wallet on the street near his office. Inside, there was some money, a few cards, and a photo of a family. Tom decided to look for the owner instead of keeping the money. He checked the cards and found a name and phone number. He called the number, and a woman answered, sounding worried. She was extremely happy when Tom explained what he had found. They met the next day, and she thanked him with a warm hug and a small gift.",questions:[{text:"Where did Tom find the wallet?",options:["At home","On the street","In a store"],answer:1},{text:"What did Tom decide to do?",options:["Keep the money","Look for the owner","Ignore it"],answer:1},{text:"How did the woman feel when Tom called?",options:["Angry","Happy","Confused"],answer:1}]},{id:"best-friend",title:"My Best Friend",level:"Principiante",text:"My best friend's name is Laura. We met in school when we were seven years old. She is kind, funny, and always ready to help. We like doing the same things: we both love music and dogs. Every weekend, we meet at the park or watch movies together. I am very lucky to have a friend like her.",questions:[{text:"When did they meet?",options:["At work","In school","On vacation"],answer:1},{text:"What do they both love?",options:["Music and dogs","Books and cats","Sports and cars"],answer:0},{text:"What do they do on weekends?",options:["Study together","Meet at the park or watch movies","Travel"],answer:1}]},{id:"rainy-day",title:"A Rainy Day",level:"Principiante",text:"Today it is raining a lot. I decided to stay home instead of going out. I made a cup of tea and read my favorite book. In the afternoon, I called my mother and we talked for an hour. Later, I cooked pasta for dinner. Even though the weather was bad, it was a relaxing day.",questions:[{text:"What is the weather like?",options:["Sunny","Rainy","Snowy"],answer:1},{text:"What did the writer do in the afternoon?",options:["Went shopping","Called their mother","Watched TV"],answer:1},{text:"How did the writer feel about the day?",options:["Bored","Relaxed","Angry"],answer:1}]},{id:"learning-language",title:"Learning a New Language",level:"Intermedio",text:"Learning a new language can be difficult, but it is also very rewarding. Experts say that practicing a little every day is better than studying for many hours once a week. Watching movies, listening to music, and talking with native speakers can help a lot. It is important not to be afraid of making mistakes, because that is part of learning. With patience and practice, anyone can learn a new language.",questions:[{text:"What do experts recommend?",options:["Studying once a week","Practicing a little every day","Never making mistakes"],answer:1},{text:"What can help you learn?",options:["Watching movies and listening to music","Only reading grammar books","Avoiding native speakers"],answer:0},{text:"What should you not be afraid of?",options:["Speaking loudly","Making mistakes","Asking questions"],answer:1}]},{id:"first-day-work",title:"The First Day at Work",level:"Intermedio",text:"Carlos woke up early, feeling nervous and excited. It was his first day at his new job. He put on his best clothes and arrived fifteen minutes early. His new manager welcomed him warmly and introduced him to the team. Everyone was friendly, and by lunchtime, Carlos felt more comfortable. At the end of the day, he thought, this is going to be a great place to work.",questions:[{text:"How did Carlos feel in the morning?",options:["Bored","Nervous and excited","Angry"],answer:1},{text:"What time did he arrive?",options:["Fifteen minutes late","On time exactly","Fifteen minutes early"],answer:2},{text:"How did Carlos feel by the end of the day?",options:["Comfortable","Confused","Sad"],answer:0}]},{id:"saving-money",title:"Saving Money",level:"Intermedio",text:"Many people struggle to save money, even when they earn a good salary. Financial experts suggest creating a monthly budget and tracking all expenses. It also helps to set clear goals, such as saving for a trip or an emergency fund. Small changes, like cooking at home instead of eating out, can make a big difference over time. The key is consistency: saving a little every month is more effective than trying to save a lot all at once.",questions:[{text:"What do experts suggest?",options:["Spending more","Creating a budget and tracking expenses","Ignoring goals"],answer:1},{text:"What example of a small change is given?",options:["Cooking at home","Buying a car","Traveling more"],answer:0},{text:"What is described as the key to saving?",options:["Earning more money","Consistency","Luck"],answer:1}]},{id:"coffee-history",title:"The History of Coffee",level:"Avanzado",text:"Coffee has a long and interesting history. According to legend, it was discovered in Ethiopia by a goat herder who noticed his goats became energetic after eating certain berries. From there, coffee spread to the Arabian Peninsula and eventually to Europe in the seventeenth century. Today, coffee is one of the most traded products in the world, and millions of people drink it every day. Its popularity continues to grow, with new ways of preparing it appearing constantly.",questions:[{text:"Where was coffee discovered, according to legend?",options:["Europe","Ethiopia","Brazil"],answer:1},{text:"Who noticed the goats' behavior?",options:["A farmer","A goat herder","A scientist"],answer:1},{text:"When did coffee spread to Europe?",options:["In the seventeenth century","In the twentieth century","In ancient times"],answer:0}]},{id:"working-home",title:"Working from Home",level:"Avanzado",text:"In recent years, more companies have allowed employees to work from home. This change has advantages and disadvantages. On one hand, workers save time by not commuting and often feel more relaxed in their own space. On the other hand, some people find it difficult to separate work from personal life, and they may feel isolated without their colleagues nearby. Many companies now offer a hybrid model, combining days at home with days at the office, trying to get the best of both worlds.",questions:[{text:"What is one advantage of working from home?",options:["More commuting","Saving time by not commuting","Less flexibility"],answer:1},{text:"What is one disadvantage mentioned?",options:["Too much social contact","Feeling isolated","Higher salary"],answer:1},{text:"What model do many companies now offer?",options:["Fully remote only","Fully in-office only","A hybrid model"],answer:2}]},{id:"unexpected-trip",title:"An Unexpected Trip",level:"Intermedio",text:"Last month, my friend called me and said, let's go on a road trip this weekend! I had no plans, so I said yes immediately. We packed our bags and drove to the mountains without a clear plan. We found a small town with amazing food and friendly people. We slept in a cheap hotel and spent two days hiking and taking photos. It was one of the best weekends of my life, and it taught me that sometimes the best trips are the ones you don't plan.",questions:[{text:"How did the trip start?",options:["It was planned months before","A friend suggested it suddenly","They won a prize"],answer:1},{text:"Where did they go?",options:["To the beach","To the mountains","To another country"],answer:1},{text:"What did the writer learn?",options:["Planning is always necessary","Unplanned trips can be great","Hotels are too expensive"],answer:1}]},{id:"ai-daily-life",title:"Artificial Intelligence in Daily Life",level:"Avanzado",text:"Artificial intelligence has become part of everyday life, often without people noticing. It suggests what to watch, translates languages instantly, and helps doctors detect diseases earlier. However, this technology also raises important questions about privacy and jobs. Some experts believe repetitive tasks will disappear, while new roles will emerge that require creativity and critical thinking. Governments and companies are now discussing how to use artificial intelligence responsibly, making sure it benefits society without causing unnecessary harm. The next decade will likely show how well humans and machines can work together.",questions:[{text:"What does the text say AI helps doctors do?",options:["Perform surgery","Detect diseases earlier","Write prescriptions"],answer:1},{text:"According to the text, what will happen to repetitive tasks?",options:["They will increase","They will disappear","They will stay the same"],answer:1},{text:"What are governments and companies discussing?",options:["Banning AI completely","Using AI responsibly","Ignoring AI"],answer:1}]},{id:"power-of-habits",title:"The Power of Habits",level:"Avanzado",text:"Habits shape a large part of daily life, often more than people realize. Researchers explain that a habit forms through a simple cycle: a cue triggers a routine, which is followed by a reward. Once this cycle repeats enough times, the brain starts performing the action almost automatically. This explains why breaking a bad habit can be so difficult, and why building a good one requires patience. Experts suggest starting with small, specific changes instead of ambitious goals. Over time, these small actions accumulate and can lead to significant improvements in health, productivity, and overall well-being.",questions:[{text:"What three parts make up the habit cycle, according to the text?",options:["Cue, routine, reward","Start, middle, end","Though
