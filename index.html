function speak(text) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'en-US';
  utter.rate = 0.88;
  window.speechSynthesis.speak(utter);
}

function normalizeText(s) {
  return s.toLowerCase().replace(/[^\w\s]/g, '').trim();
}

function shuffleArr(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function todayKey() {
  return new Date().toISOString().slice(0, 10);
}

function computeStreak(visitDates) {
  const set = new Set(visitDates);
  let streak = 0;
  const d = new Date();
  while (true) {
    const key = d.toISOString().slice(0, 10);
    if (set.has(key)) {
      streak++;
      d.setDate(d.getDate() - 1);
    } else break;
  }
  return streak;
}

/* --- Almacenamiento: usa window.storage (Claude) si existe, si no localStorage (sitio real) --- */
function hasCloudStorage() {
  return typeof window.storage !== 'undefined';
}
async function storageGet(key) {
  if (hasCloudStorage()) {
    try {
      const res = await window.storage.get(key);
      return res ? res.value : null;
    } catch (e) { return null; }
  }
  try { return window.localStorage.getItem(key); } catch (e) { return null; }
}
async function storageSet(key, value) {
  if (hasCloudStorage()) {
    try { await window.storage.set(key, value); return; } catch (e) {}
  }
  try { window.localStorage.setItem(key, value); } catch (e) {}
}

/* --- Sincronización con GitHub Gist --- */
const GIST_FILENAME = 'bridge-english-progress.json';

async function gistSync(token, gistId, progress) {
  const payload = {
    description: 'Bridge English - progreso (privado, no compartir el enlace)',
    public: false,
    files: { [GIST_FILENAME]: { content: JSON.stringify(progress, null, 2) } },
  };
  const url = gistId ? `https://api.github.com/gists/${gistId}` : 'https://api.github.com/gists';
  const res = await fetch(url, {
    method: gistId ? 'PATCH' : 'POST',
    headers: {
      Authorization: `Bearer ${token}`,
      Accept: 'application/vnd.github+json',
      'Content-Type': 'application/json',
    },
    body: JSON.stringify(payload),
  });
  if (!res.ok) throw new Error('No se pudo sincronizar (código ' + res.status + ')');
  const data = await res.json();
  return data.id;
}

async function gistRestore(token, gistId) {
  const res = await fetch(`https://api.github.com/gists/${gistId}`, {
    headers: { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json' },
  });
  if (!res.ok) throw new Error('No se pudo restaurar (código ' + res.status + ')');
  const data = await res.json();
  const file = data.files && data.files[GIST_FILENAME];
  if (!file) throw new Error('Ese gist no tiene un archivo de progreso de Bridge English.');
  return JSON.parse(file.content);
}

function ExerciseRunner({ item, colorAccent, onComplete, backLabel, onBack, headerExtra }) {
  const [answers, setAnswers] = useState({});
  const [checked, setChecked] = useState(false);
  const selectAnswer = (qIdx, optIdx) => {
    if (checked) return;
    setAnswers((prev) => ({ ...prev, [qIdx]: optIdx }));
  };
  const verify = () => {
    const score = item.questions.filter((q, i) => answers[i] === q.answer).length;
    setChecked(true);
    onComplete(item.id, score);
  };
  const retry = () => { setAnswers({}); setChecked(false); };
  const allAnswered = Object.keys(answers).length === item.questions.length;
  const score = item.questions.filter((q, i) => answers[i] === q.answer).length;

  return (
    <div>
      <button onClick={onBack} style={{ color: COLORS.textMuted }}
        className="text-sm flex items-center gap-1 mb-4 hover:opacity-80 transition">
        <IconChevronLeft size={16} />{backLabel}
      </button>
      {headerExtra}
      <h3 style={{ color: COLORS.text }} className="text-sm font-medium mb-4">Practica</h3>
      {item.questions.map((q, i) => (
        <QuestionBlock key={i} question={q} qIdx={i} selected={answers[i]} checked={checked} onSelect={selectAnswer} />
      ))}
      {!checked ? (
        <button onClick={verify} disabled={!allAnswered}
          style={{ background: allAnswered ? colorAccent : COLORS.surfaceRaised, color: allAnswered ? COLORS.bg : COLORS.textMuted }}
          className="text-sm rounded-full px-5 py-2 mt-2 transition">
          Verificar respuestas
        </button>
      ) : (
        <div style={{ color: COLORS.text }} className="mt-2 text-sm">
          Obtuviste <span style={{ fontFamily: FONT_MONO, color: colorAccent }}>{score}/{item.questions.length}</span>{' '}
          — <button onClick={retry} style={{ color: COLORS.teal }} className="underline underline-offset-2">Intentar de nuevo</button>
        </div>
      )}
    </div>
  );
}

function MatchingGame({ category }) {
  const pairCount = Math.min(6, category.words.length);
  const buildRound = () => {
    const pairs = shuffleArr(category.words).slice(0, pairCount).map((w, i) => ({ ...w, id: i }));
    return { pairs, en: shuffleArr(pairs), es: shuffleArr(pairs) };
  };
  const [round, setRound] = useState(buildRound);
  const [selectedEn, setSelectedEn] = useState(null);
  const [matched, setMatched] = useState([]);
  const [wrong, setWrong] = useState(null);

  useEffect(() => { setRound(buildRound()); setMatched([]); setSelectedEn(null); }, [category.id]);

  const clickEn = (tile) => { if (matched.includes(tile.id)) return; setSelectedEn(tile); setWrong(null); };
  const clickEs = (tile) => {
    if (matched.includes(tile.id) || !selectedEn) return;
    if (selectedEn.id === tile.id) {
      setMatched((m) => [...m, tile.id]);
      setSelectedEn(null);
    } else {
      setWrong({ en: selectedEn.id, es: tile.id });
      setTimeout(() => setWrong(null), 450);
      setSelectedEn(null);
    }
  };
  const allDone = matched.length === pairCount;
  const newRound = () => { setRound(buildRound()); setMatched([]); setSelectedEn(null); };

  const tileStyle = (tile, isEn) => {
    const isMatched = matched.includes(tile.id);
    const isSelected = isEn && selectedEn && selectedEn.id === tile.id;
    const isWrong = wrong && ((isEn && wrong.en === tile.id) || (!isEn && wrong.es === tile.id));
    if (isMatched) return { borderColor: COLORS.teal, background: `${COLORS.teal}14`, color: COLORS.teal, opacity: 0.6 };
    if (isWrong) return { borderColor: COLORS.rose, background: `${COLORS.rose}1A`, color: COLORS.rose };
    if (isSelected) return { borderColor: COLORS.indigo, background: `${COLORS.indigo}1A`, color: COLORS.text };
    return { borderColor: COLORS.border, background: COLORS.surface, color: COLORS.text };
  };

  return (
    <div>
      {allDone && (
        <div style={{ background: `${COLORS.teal}14`, color: COLORS.teal, borderColor: COLORS.teal }}
          className="border rounded-xl p-3 text-sm mb-4 flex items-center justify-between">
          <span>¡Completaste la ronda! 🎉</span>
          <button onClick={newRound} style={{ color: COLORS.teal }} className="underline underline-offset-2">Otra ronda</button>
        </div>
      )}
      <div className="grid grid-cols-2 gap-3">
        <div className="flex flex-col gap-2">
          {round.en.map((tile) => (
            <button key={'en' + tile.id} disabled={matched.includes(tile.id)} onClick={() => clickEn(tile)}
              style={tileStyle(tile, true)} className={"border rounded-xl px-3 py-2.5 text-sm text-left transition" + (wrong && wrong.en === tile.id ? " shake" : "")}>
              {tile.en}
            </button>
          ))}
        </div>
        <div className="flex flex-col gap-2">
          {round.es.map((tile) => (
            <button key={'es' + tile.id} disabled={matched.includes(tile.id)} onClick={() => clickEs(tile)}
              style={tileStyle(tile, false)} className={"border rounded-xl px-3 py-2.5 text-sm text-left transition" + (wrong && wrong.es === tile.id ? " shake" : "")}>
              {tile.es}
            </button>
          ))}
        </div>
      </div>
      {!allDone && (
        <button onClick={newRound} style={{ color: COLORS.textMuted }} className="mt-4 text-xs flex items-center gap-1.5 hover:opacity-80 transition">
          <IconShuffle size={13} />Mezclar de nuevo
        </button>
      )}
    </div>
  );

function SpeakingView({ progress, onPractice }) {
  const [group, setGroup] = useState(SPEAKING_GROUPS[0].id);
  const [listeningIdx, setListeningIdx] = useState(null);
  const [results, setResults] = useState({});
  const [errorMsg, setErrorMsg] = useState('');
  const [supported, setSupported] = useState(true);

  useEffect(() => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    setSupported(!!SR);
  }, []);

  const activeGroup = SPEAKING_GROUPS.find((g) => g.id === group);

  const practice = (globalIdx, phrase) => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) return;
    setErrorMsg('');
    const recognition = new SR();
    recognition.lang = 'en-US';
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;
    setListeningIdx(globalIdx);
    recognition.onresult = (event) => {
      const transcript = event.results[0][0].transcript;
      const match = normalizeText(transcript) === normalizeText(phrase.en);
      setResults((prev) => ({ ...prev, [globalIdx]: { transcript, match } }));
      onPractice(globalIdx);
    };
    recognition.onerror = (e) => {
      setListeningIdx(null);
      setErrorMsg(e.error === 'not-allowed' ? 'Necesitamos permiso para usar tu micrófono.' : 'No se pudo reconocer el audio, intenta de nuevo.');
    };
    recognition.onend = () => setListeningIdx(null);
    recognition.start();
  };

  return (
    <div className="max-w-3xl mx-auto px-5 py-8">
      <h2 style={{ fontFamily: FONT_DISPLAY, color: COLORS.text }} className="text-2xl font-semibold mb-2">Pronunciación</h2>
      <p style={{ color: COLORS.textMuted }} className="text-sm mb-4">Escucha cada frase y luego repítela en voz alta.</p>

      <div className="flex flex-wrap gap-2 mb-6">
        {SPEAKING_GROUPS.map((g) => (
          <button key={g.id} onClick={() => setGroup(g.id)}
            style={{ background: group === g.id ? COLORS.rose : 'transparent', color: group === g.id ? COLORS.bg : COLORS.textMuted, borderColor: group === g.id ? COLORS.rose : COLORS.border }}
            className="text-sm border rounded-full px-3.5 py-1.5 transition">
            {g.name}
          </button>
        ))}
      </div>

      {!supported && (
        <div style={{ background: `${COLORS.rose}1A`, color: COLORS.rose, borderColor: COLORS.rose }} className="border rounded-xl p-3 text-sm mb-6">
          Tu navegador no soporta reconocimiento de voz. Puedes seguir escuchando los audios; para practicar tu pronunciación, prueba desde Chrome o Edge.
        </div>
      )}
      {errorMsg && (
        <div style={{ background: `${COLORS.rose}1A`, color: COLORS.rose, borderColor: COLORS.rose }} className="border rounded-xl p-3 text-sm mb-6">{errorMsg}</div>
      )}

      <div className="flex flex-col gap-3">
        {activeGroup.phrases.map((phrase, localIdx) => {
          const globalIdx = SPEAKING_PHRASES.indexOf(phrase);
          const result = results[globalIdx];
          const practiced = progress.practicedPhrases.includes(globalIdx);
          return (
            <div key={globalIdx} style={{ background: COLORS.surface, borderColor: practiced ? COLORS.rose : COLORS.border }} className="border rounded-2xl p-4">
              <div className="flex items-center justify-between gap-3">
                <div className="min-w-0">
                  <p style={{ fontFamily: FONT_DISPLAY, color: COLORS.text }} className="text-base truncate">{phrase.en}</p>
                  <p style={{ color: COLORS.textMuted }} className="text-xs mt-0.5">{phrase.es}</p>
                </div>
                <div className="flex items-center gap-2 shrink-0">
                  <button onClick={() => speak(phrase.en)} style={{ color: COLORS.textMuted, borderColor: COLORS.border }}
                    className="border rounded-full p-2 hover:opacity-80 transition" aria-label="Escuchar">
                    <IconVolume size={16} />
                  </button>
                  {supported && (
                    <button onClick={() => practice(globalIdx, phrase)} disabled={listeningIdx !== null}
                      style={{ color: listeningIdx === globalIdx ? COLORS.bg : COLORS.rose, background: listeningIdx === globalIdx ? COLORS.rose : `${COLORS.rose}1A`, borderColor: COLORS.rose }}
                      className="border rounded-full p-2 transition" aria-label="Practicar">
                      <IconMic size={16} />
                    </button>
                  )}
                </div>
              </div>
              {listeningIdx === globalIdx && <p style={{ color: COLORS.rose }} className="text-xs mt-2">Escuchando…</p>}
              {result && (
                <p style={{ color: result.match ? COLORS.teal : COLORS.textMuted }} className="text-xs mt-2">
                  {result.match ? '¡Muy bien! 🎉' : `Escuché: "${result.transcript}" — intenta de nuevo`}
                </p>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function SentenceExercise({ exercise, onComplete, doneAlready }) {
  const buildTiles = () => shuffleArr(exercise.words.map((w, i) => ({ word: w, id: i })));
  const [pool, setPool] = useState(buildTiles);
  const [answer, setAnswer] = useState([]);
  const [status, setStatus] = useState(doneAlready ? 'correct' : null);

  useEffect(() => {
    if (doneAlready) {
      setAnswer(exercise.words.map((w, i) => ({ word: w, id: i })));
      setPool([]);
      setStatus('correct');
    }
  }, []);

  const pick = (tile) => {
    if (status === 'correct') return;
    setPool((p) => p.filter((t) => t.id !== tile.id));
    setAnswer((a) => [...a, tile]);
    setStatus(null);
  };
  const unpick = (tile) => {
    if (status === 'correct') return;
    setAnswer((a) => a.filter((t) => t.id !== tile.id));
    setPool((p) => [...p, tile]);
  };
  const check = () => {
    const built = answer.map((t) => t.word).join(' ');
    const target = exercise.words.join(' ');
    if (built === target) { setStatus('correct'); onComplete(exercise.id); }
    else setStatus('wrong');
  };
  const reset = () => { setPool(buildTiles()); setAnswer([]); setStatus(null); };

  return (
    <div>
      <p style={{ color: COLORS.textMuted }} className="text-sm mb-1">Ordena las palabras para traducir:</p>
      <p style={{ fontFamily: FONT_DISPLAY, color: COLORS.text }} className="text-xl mb-5">{exercise.es}</p>

      <div style={{ borderColor: COLORS.border, minHeight: 56 }} className="border rounded-xl p-3 flex flex-wrap gap-2 mb-4">
        {answer.length === 0 && <span style={{ color: COLORS.textMuted }} className="text-sm">Toca las palabras de abajo en orden…</span>}
        {answer.map((tile) => (
          <button key={tile.id} onClick={() => unpick(tile)}
            style={{ borderColor: status === 'correct' ? COLORS.teal : COLORS.indigo, background: status === 'correct' ? `${COLORS.teal}1A` : `${COLORS.indigo}1A`, color: status === 'correct' ? COLORS.teal : COLORS.text }}
            className="border rounded-lg px-3 py-1.5 text-sm">
            {tile.word}
          </button>
        ))}
      </div>

      <div className={"flex flex-wrap gap-2 mb-5" + (status === 'wrong' ? " shake" : "")}>
        {pool.map((tile) => (
          <button key={tile.id} onClick={() => pick(tile)}
            style={{ borderColor: COLORS.border, background: COLORS.surface, color: COLORS.text }}
            className="border rounded-lg px-3 py-1.5 text-sm hover:opacity-80 transition">
            {tile.word}
          </button>
        ))}
      </div>

      {status === 'correct' ? (
        <p style={{ color: COLORS.teal }} className="text-sm flex items-center gap-1.5"><IconCheckCircle size={16} />¡Correcto!</p>
      ) : (
        <div className="flex items-center gap-3">
          <button onClick={check} disabled={pool.length > 0}
            style={{ background: pool.length === 0 ? COLORS.teal : COLORS.surfaceRaised, color: pool.length === 0 ? COLORS.bg : COLORS.textMuted }}
            className="text-sm rounded-full px-5 py-2 transition">
            Verificar
          </button>
          {status === 'wrong' && (
            <>
              <span style={{ color: COLORS.rose }} className="text-sm">No es correcto</span>
              <button onClick={reset} style={{ color: COLORS.textMuted }} className="text-sm underline underline-offset-2">Reintentar</button>
            </>
          )}
        </div>
      )}
    </div>
  );
}

function CloudPanel({ onClose, token, gistId, saveToken, forgetToken, saveGistId, progress, applyRestoredProgress }) {
  const [tokenInput, setTokenInput] = useState(token || '');
  const [gistInput, setGistInput] = useState(gistId || '');
  const [status, setStatus] = useState('');
  const [busy, setBusy] = useState(false);

  const doSaveToken = () => { saveToken(tokenInput.trim()); setStatus('Token guardado en este navegador.'); };
  const doForget = () => { forgetToken(); setTokenInput(''); setGistInput(''); setStatus('Token olvidado.'); };

  const doSync = async () => {
    if (!token) { setStatus('Primero guarda tu token de GitHub.'); return; }
    setBusy(true); setStatus('Sincronizando…');
    try {
      const newId = await gistSync(token, gistId, progress);
      saveGistId(newId);
      setGistInput(newId);
      setStatus('Sincronizado ✓ ' + new Date().toLocaleTimeString());
    } catch (e) { setStatus('Error: ' + e.message); }
    finally { setBusy(false); }
  };

  const doRestore = async () => {
    const useId = gistInput.trim() || gistId;
    if (!token || !useId) { setStatus('Necesitas un token y un ID de gist (sincroniza al menos una vez, o pega uno existente).'); return; }
    setBusy(true); setStatus('Restaurando…');
    try {
      const restored = await gistRestore(token, useId);
      applyRestoredProgress(restored);
      saveGistId(useId);
      setStatus('Progreso restaurado ✓');
    } catch (e) { setStatus('Error: ' + e.message); }
    finally { setBusy(false); }
  };

  return (
    <div style={{ background: 'rgba(0,0,0,0.6)' }} className="fixed inset-0 flex items-start sm:items-center justify-center p-4 z-30 overflow-y-auto">
      <div style={{ background: COLORS.surface, borderColor: COLORS.border }} className="border rounded-2xl p-5 max-w-md w-full my-8">
        <div className="flex items-center justify-between mb-4">
          <h3 style={{ fontFamily: FONT_DISPLAY, color: COLORS.text }} className="text-lg flex items-center gap-2">
            <IconCloud size={18} style={{ color: COLORS.teal }} />Copia en la nube
          </h3>
          <button onClick={onClose} style={{ color: COLORS.textMuted }}><IconX size={18} /></button>
        </div>

        <p style={{ color: COLORS.textMuted }} className="text-xs leading-relaxed mb-4">
          Guarda tu progreso en un Gist privado y secreto de tu cuenta de GitHub, para no perderlo y poder
          verlo desde otro dispositivo. Necesitas un token personal de GitHub con permiso <b style={{color: COLORS.text}}>gist</b> solamente.
        </p>

        <details className="mb-4">
          <summary style={{ color: COLORS.indigo }} className="text-xs cursor-pointer">¿Cómo consigo un token?</summary>
          <ol style={{ color: COLORS.textMuted }} className="text-xs mt-2 space-y-1 pl-4 list-decimal">
            <li>Ve a github.com/settings/tokens y elige "Generate new token (classic)"</li>
            <li>Ponle un nombre, y en "Select scopes" marca solo <b style={{color: COLORS.text}}>gist</b></li>
            <li>Genera el token y cópialo (solo se muestra una vez)</li>
            <li>Pégalo abajo — se queda solo en este navegador, nunca se sube al repositorio</li>
          </ol>
        </details>

        <label style={{ color: COLORS.text }} className="text-xs font-medium">Token de GitHub</label>
        <input type="password" value={tokenInput} onChange={(e) => setTokenInput(e.target.value)}
          placeholder="ghp_..." style={{ background: COLORS.bg, borderColor: COLORS.border, color: COLORS.text }}
          className="w-full border rounded-lg px-3 py-2 text-sm mt-1 mb-3" />

        <label style={{ color: COLORS.text }} className="text-xs font-medium">ID del Gist (opcional, para restaurar en otro dispositivo)</label>
        <input type="text" value={gistInput} onChange={(e) => setGistInput(e.target.value)}
          placeholder="Se completa automáticamente al sincronizar" style={{ background: COLORS.bg, borderColor: COLORS.border, color: COLORS.text }}
          className="w-full border rounded-lg px-3 py-2 text-sm mt-1 mb-4" />

        <div className="flex flex-wrap gap-2 mb-3">
          <button onClick={doSaveToken} style={{ background: COLORS.indigo, color: COLORS.bg }} className="text-sm rounded-full px-4 py-1.5">Guardar token</button>
          <button onClick={doForget} style={{ color: COLORS.rose, borderColor: COLORS.rose }} className="text-sm border rounded-full px-4 py-1.5">Olvidar token</button>
        </div>
        <div className="flex flex-wrap gap-2 mb-3">
          <button onClick={doSync} disabled={busy} style={{ background: COLORS.teal, color: COLORS.bg }} className="text-sm rounded-full px-4 py-1.5">Sincronizar ahora</button>
          <button onClick={doRestore} disabled={busy} style={{ color: COLORS.text, borderColor: COLORS.border }} className="text-sm border rounded-full px-4 py-1.5">Restaurar desde la nube</button>
        </div>

        {status && <p style={{ color: COLORS.textMuted }} className="text-xs mt-2">{status}</p>}
      </div>
    </div>
  );
}

/* APP PRINCIPAL                                                     */

const EMPTY_PROGRESS = { knownWords: [], grammarScores: {}, readingScores: {}, practicedPhrases: [], sentencesCompleted: [], visitDates: [] };
const KEY_PROGRESS = 'bridge-english-progress-v2';
const KEY_TOKEN = 'bridge-english-gh-token';
const KEY_GISTID = 'bridge-english-gh-gistid';

function App() {
  const [view, setView] = useState('dashboard');
  const [progress, setProgress] = useState(EMPTY_PROGRESS);
  const [confirmReset, setConfirmReset] = useState(false);
  const [cloudOpen, setCloudOpen] = useState(false);
  const [token, setToken] = useState('');
  const [gistId, setGistId] = useState('');

  useEffect(() => {
    let mounted = true;
    (async () => {
      const [rawProgress, rawToken, rawGistId] = await Promise.all([
        storageGet(KEY_PROGRESS), storageGet(KEY_TOKEN), storageGet(KEY_GISTID),
      ]);
      if (!mounted) return;
      let loaded = EMPTY_PROGRESS;
      if (rawProgress) {
        try { loaded = { ...EMPTY_PROGRESS, ...JSON.parse(rawProgress) }; } catch (e) {}
      }
      const today = todayKey();
      if (!loaded.visitDates.includes(today)) loaded = { ...loaded, visitDates: [...loaded.visitDates, today] };
      setProgress(loaded);
      storageSet(KEY_PROGRESS, JSON.stringify(loaded));
      if (rawToken) setToken(rawToken);
      if (rawGistId) setGistId(rawGistId);
    })();
    return () => { mounted = false; };
  }, []);

  const persist = (next) => { setProgress(next); storageSet(KEY_PROGRESS, JSON.stringify(next)); };

  const toggleKnownWord = (wordId) => {
    const known = new Set(progress.knownWords);
    if (known.has(wordId)) known.delete(wordId); else known.add(wordId);
    persist({ ...progress, knownWords: Array.from(known) });
  };
  const saveGrammarScore = (lessonId, score) => persist({ ...progress, grammarScores: { ...progress.grammarScores, [lessonId]: score } });
  const saveReadingScore = (passageId, score) => persist({ ...progress, readingScores: { ...progress.readingScores, [passageId]: score } });
  const markPracticed = (idx) => { if (!progress.practicedPhrases.includes(idx)) persist({ ...progress, practicedPhrases: [...progress.practicedPhrases, idx] }); };
  const markSentence = (id) => { if (!progress.sentencesCompleted.includes(id)) persist({ ...progress, sentencesCompleted: [...progress.sentencesCompleted, id] }); };
  const doReset = () => { persist(EMPTY_PROGRESS); setConfirmReset(false); };

  const saveToken = (t) => { setToken(t); storageSet(KEY_TOKEN, t); };
  const forgetToken = () => { setToken(''); setGistId(''); storageSet(KEY_TOKEN, ''); storageSet(KEY_GISTID, ''); };
  const saveGistId = (id) => { setGistId(id); storageSet(KEY_GISTID, id); };
  const applyRestoredProgress = (restored) => persist({ ...EMPTY_PROGRESS, ...restored });

  const totalWords = VOCAB_CATEGORIES.reduce((sum, c) => sum + c.words.length, 0);
  const totalGrammar = GRAMMAR_LESSONS.length;
  const totalReading = READING_PASSAGES.length;
  const totalSpeaking = SPEAKING_PHRASES.length;
  const totalSentences = SENTENCE_EXERCISES.length;

  const doneWords = progress.knownWords.length;
  const doneGrammar = Object.keys(progress.grammarScores).length;
  const doneReading = Object.keys(progress.readingScores).length;
  const doneSpeaking = progress.practicedPhrases.length;
  const doneSentences = progress.sentencesCompleted.length;

  const totalAll = totalWords + totalGrammar + totalReading + totalSpeaking + totalSentences;
  const doneAll = doneWords + doneGrammar + doneReading + doneSpeaking + doneSentences;
  const overallPct = totalAll > 0 ? Math.round((doneAll / totalAll) * 100) : 0;
  const streak = computeStreak(progress.visitDates);

  return (
    <div style={{ background: COLORS.bg, minHeight: '100vh' }}>
      <Header view={view} setView={setView} overallPct={overallPct} streak={streak} onOpenCloud={() => setCloudOpen(true)} />

      {view === 'dashboard' && (
        <Dashboard setView={setView}
          stats={{ doneWords, totalWords, doneGrammar, totalGrammar, doneReading, totalReading, doneSpeaking, totalSpeaking, doneSentences, totalSentences }}
          onResetRequest={() => setConfirmReset(true)} />
      )}
      {view === 'vocabulario' && <VocabView progress={progress} toggleKnownWord={toggleKnownWord} />}
      {view === 'gramatica' && <GrammarView progress={progress} onComplete={saveGrammarScore} />}
      {view === 'lectura' && <ReadingView progress={progress} onComplete={saveReadingScore} />}
      {view === 'pronunciacion' && <SpeakingView progress={progress} onPractice={markPracticed} />}
      {view === 'oraciones' && <SentenceBuilderView progress={progress} onComplete={markSentence} />}

      {cloudOpen && (
        <CloudPanel onClose={() => setCloudOpen(false)} token={token} gistId={gistId}
          saveToken={saveToken} forgetToken={forgetToken} saveGistId={saveGistId}
          progress={progress} applyRestoredProgress={applyRestoredProgress} />
      )}

      {confirmReset && (
        <div style={{ background: 'rgba(0,0,0,0.6)' }} className="fixed inset-0 flex items-center justify-center p-5 z-30">
          <div style={{ background: COLORS.surface, borderColor: COLORS.border }} className="border rounded-2xl p-5 max-w-xs w-full">
            <p style={{ color: COLORS.text }} className="text-sm mb-4">¿Seguro que quieres reiniciar todo tu progreso local? Esta acción no se puede deshacer.</p>
            <div className="flex gap-2 justify-end">
              <button onClick={() => setConfirmReset(false)} style={{ color: COLORS.textMuted, borderColor: COLORS.border }} className="text-sm border rounded-full px-4 py-1.5">Cancelar</button>
              <button onClick={doReset} style={{ color: COLORS.bg, background: COLORS.rose }} className="text-sm rounded-full px-4 py-1.5">Reiniciar</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>

    s.textContent = output;
    document.body.appendChild(s);
